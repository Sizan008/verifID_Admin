# Spring
spring.application.name=verifidadmin
spring.threads.virtual.enabled=true
server.port=8083
debug=false
#scheema
spring.jpa.properties.hibernate.default_schema=VERIFID
spring.jpa.open-in-view=false
# Logger Socket
microcube.logging.socket.host=localhost
microcube.logging.socket.port=5000
microcube.logging.level=DEBUG
# Microcube Data Loading
microcube.mock.enabled=false
microcube.mock.data=10
spring.jpa.hibernate.ddl-auto=none
# Microcube Publisher
microcube.publisher.agent.enabled=true
microcube.publisher.agent.interval=1000
## Strategy realtime, queue
microcube.publisher.publish.strategy=realtime
microcube.publisher.message.max.attempt=2
#Microcube Publisher
microcube.subscriber.agent.enabled=true
microcube.subscriber.agent.interval=1000
##Strategy realtime, queue
microcube.subscriber.subscribe.strategy=realtime
# Logging
logging.level.org.apache.kafka=ERROR
logging.level.org.springframework.kafka=ERROR
# Persistence Logging
#logging.level.org.hibernate.SQL= DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
#spring.jpa.show-sql= true
#spring.jpa.properties.hibernate.format_sql= true
# Kafka Server
spring.kafka.bootstrap-servers=localhost:9092
# Kafka Consumer
spring.kafka.consumer.auto-offset-reset=earliest
# Kafka Producer
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.acks=all
# HikariCP
spring.datasource.hikari.minimumIdle=5
spring.datasource.hikari.maximumPoolSize=20
spring.datasource.hikari.idleTimeout=30000
spring.datasource.hikari.maxLifetime=2000000
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.poolName=HikariPool
# Oracle
spring.datasource.url=jdbc:oracle:thin:@//192.168.20.76:1521/BUPRIM
spring.datasource.username=verifid3
spring.datasource.password=verifid
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# Prometheus
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
